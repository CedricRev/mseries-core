[versions]
# Spigot API is the baseline; Paper API is only visible to the paper source set.
spigot = "26.3-R0.1-SNAPSHOT"
paper = "26.3.build.223-stable"
cloud = "2.1.0"
cloud-minecraft = "2.0.1"
brigadier = "1.3.10"
adventure = "4.21.0"
adventure-platform = "4.4.1"
hikari = "7.1.0"
sqlite = "3.53.4.0"
junit = "5.14.4"
floodgate = "2.2.3-SNAPSHOT"
cumulus = "1.1.2"
vault-unlocked = "2.11"
griefprevention = "16.18.7"

[libraries]
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
# Provided by every server at runtime; Spigot API does not expose it transitively.
brigadier = { module = "com.mojang:brigadier", version.ref = "brigadier" }
cloud-core = { module = "org.incendo:cloud-core", version.ref = "cloud" }
cloud-annotations = { module = "org.incendo:cloud-annotations", version.ref = "cloud" }
cloud-paper = { module = "org.incendo:cloud-paper", version.ref = "cloud-minecraft" }
# Bundled for MiniMessage text on every platform; plugins relocate net.kyori with core.
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
adventure-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
adventure-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }
adventure-platform-bukkit = { module = "net.kyori:adventure-platform-bukkit", version.ref = "adventure-platform" }
# Connection pool for SQLite and MySQL/MariaDB; the JDBC drivers come with the server.
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# Provided by the Floodgate plugin at runtime; only loaded when Floodgate is enabled.
floodgate-api = { module = "org.geysermc.floodgate:api", version.ref = "floodgate" }
cumulus = { module = "org.geysermc.cumulus:cumulus", version.ref = "cumulus" }
# Provided by Vault or VaultUnlocked at runtime; holds both the legacy and the VaultUnlocked economy API.
vault-unlocked-api = { module = "net.milkbowl.vault:VaultUnlockedAPI", version.ref = "vault-unlocked" }
# Provided by the GriefPrevention plugin at runtime; only loaded when GriefPrevention is enabled.
griefprevention = { module = "com.github.GriefPrevention:GriefPrevention", version.ref = "griefprevention" }
