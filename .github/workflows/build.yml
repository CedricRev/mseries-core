name: Build

# Push to main = release build; manual run on any branch = test build.
# Pushes to dev or feat/* never build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # JDK 25 is needed to read the Paper 26.x API; bytecode is still --release 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      - name: Release build
        if: github.event_name == 'push'
        run: ./gradlew build --no-daemon

      # Test builds are versioned <version>-dev+<short-sha>.
      - name: Test build
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew build --no-daemon -PdevBuild="${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v6
        with:
          name: mseries-core-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
